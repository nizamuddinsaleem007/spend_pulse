<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Stop salary vanishing. Dynamic budget, multiple income streams, and expense tracking with real-time burn-rate analytics." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <title>SpendPulse • Smart Budget & Incomes Tracker</title>
    <script>
      // Self-healing script: If browser attempts to load a dead hashed asset from stale cache
      window.addEventListener('vite:preloadError', function () {
        console.warn('[SpendPulse] Detected chunk preload error. Reloading fresh...');
        window.location.reload();
      });

      window.addEventListener('error', function (e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var src = target.src || target.href || '';
          if (src.indexOf('/assets/') !== -1) {
            console.warn('[SpendPulse] Dead asset chunk detected from stale cache. Purging service worker...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
            // Debounced reload once
            if (!sessionStorage.getItem('spendpulse_sw_recovered')) {
              sessionStorage.setItem('spendpulse_sw_recovered', 'true');
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(function (registration) {
              registration.update().catch(function () {});
            })
            .catch(function (err) {
              console.log('SW registration error', err);
            });
        });
      }
    </script>
  </body>
</html>
